apiVersion: v1
kind: ConfigMap
metadata:
  name: patch-portworx-script
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
data:
  patch-portworx.sh: |
    #!/bin/sh
    set -e

    oc -n portworx scale deploy/portworx-operator --replicas=0
    oc -n portworx patch deployment px-pure-csi-controller -n portworx --patch '{
      "spec": {
        "template": {
          "metadata": {
            "annotations": {
              "k8s.v1.cni.cncf.io/networks": "storage-network"
            }
          }
        }
      }
    }'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-portworx
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-portworx
  namespace: portworx
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-portworx
  namespace: portworx
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-portworx
subjects:
  - kind: ServiceAccount
    name: patch-portworx
    namespace: portworx
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-portworx
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: patch-portworx
      restartPolicy: Never
      containers:
        - name: patch-portworx
          image: {{ .Values.hookImage | default "registry.redhat.io/openshift4/ose-cli:latest" }}
          command: ["/bin/sh", "/scripts/patch-portworx.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: patch-portworx-script
            defaultMode: 0755
