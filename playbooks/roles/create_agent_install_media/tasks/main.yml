---
# tasks file for create_agent_install_media
- name: Validate boot_method
  ansible.builtin.fail:
    msg: "boot_method must be 'iso' or 'pxe', got: {{ boot_method }}"
  when: boot_method not in ['iso', 'pxe']

- name: Compute output directory paths
  ansible.builtin.set_fact:
    work_dir: "{{ playbook_dir }}/output/{{ cluster_name }}/work"
    backup_dir: "{{ playbook_dir }}/output/{{ cluster_name }}/backup"
    rendered_manifests_dir: "{{ playbook_dir }}/output/{{ cluster_name }}/rendered_manifests"

- name: Clean up previous output for this cluster
  # Wipe any leftover output from a prior run before starting -- stale files
  # here (e.g. from a run that failed partway through) have previously caused
  # confusing debugging sessions where it wasn't obvious a file was stale
  # rather than freshly generated.
  ansible.builtin.file:
    path: "{{ playbook_dir }}/output/{{ cluster_name }}"
    state: absent

- name: Create install directory structure
  ansible.builtin.file:
    path: "{{ work_dir }}/machine-configs"
    state: directory
    mode: '0755'
    recurse: true

- name: Create openshift directory structure
  ansible.builtin.file:
    path: "{{ work_dir }}/openshift"
    state: directory
    mode: '0755'
    recurse: true

- name: Render custom-hosts.txt
  ansible.builtin.template:
    dest: "{{ work_dir }}/custom-hosts.txt"
    mode: '0644'
    src: custom-hosts.txt.j2

- name: Compute hosts_custom (base64-encoded /etc/hosts content)
  ansible.builtin.set_fact:
    hosts_custom: "{{ lookup('template', 'custom-hosts.txt.j2') | b64encode }}"

- name: Create install-config.yaml
  ansible.builtin.template:
    dest: "{{ work_dir }}/install-config.yaml"
    mode: '0755'
    src: install-config.j2

- name: Create agent-config.yaml
  ansible.builtin.template:
    dest: "{{ work_dir }}/agent-config.yaml"
    mode: '0755'
    src: agent-config.j2

- name: Create 99-master-custom-configs.yaml
  ansible.builtin.template:
    dest: "{{ work_dir }}/machine-configs/99-master-custom-configs.yaml"
    mode: '0755'
    src: 99-master-custom-configs.j2

- name: Create 99-worker-custom-configs.yaml
  ansible.builtin.template:
    dest: "{{ work_dir }}/machine-configs/99-worker-custom-configs.yaml"
    mode: '0755'
    src: 99-worker-custom-configs.j2

- name: Create 98-master-var-lib-etcd.yaml
  ansible.builtin.template:
    dest: "{{ work_dir }}/openshift/98-master-var-lib-etcd.yaml"
    mode: '0755'
    src: 98-master-var-lib-etcd.j2

- name: Create rendered manifests backup directory
  ansible.builtin.file:
    path: "{{ rendered_manifests_dir }}"
    state: directory
    mode: '0755'

- name: Preserve rendered manifests before openshift-install consumes them
  # install-config.yaml and agent-config.yaml specifically get consumed/removed
  # by "create cluster-manifests" below, with nothing else in this playbook
  # keeping a copy -- back them up here so they're inspectable afterward.
  ansible.builtin.copy:
    src: "{{ work_dir }}/{{ item.src }}"
    dest: "{{ rendered_manifests_dir }}/{{ item.dest }}"
    remote_src: true
  loop:
    - { src: install-config.yaml, dest: install-config.yaml }
    - { src: agent-config.yaml, dest: agent-config.yaml }
    - { src: machine-configs/99-master-custom-configs.yaml, dest: 99-master-custom-configs.yaml }
    - { src: machine-configs/99-worker-custom-configs.yaml, dest: 99-worker-custom-configs.yaml }
    - { src: openshift/98-master-var-lib-etcd.yaml, dest: 98-master-var-lib-etcd.yaml }

- name: Create manifests from generated files
  ansible.builtin.command: openshift-install-fips agent create cluster-manifests --dir {{ work_dir }}

- name: Insert TPM configuration into agent-cluster-install.yaml
  ansible.builtin.blockinfile:
    path: "{{ work_dir }}/cluster-manifests/agent-cluster-install.yaml"
    insertafter: '^\s*spec:\s*$'
    block: |2
        diskEncryption:
          enableOn: all
          mode: tpmv2

- name: Backup install directory to preserve generated files
  ansible.builtin.copy:
    src: "{{ work_dir }}/"
    dest: "{{ backup_dir }}/"
    remote_src: true

- name: Generate the Agent ISO
  # Use the absolute path or ensure openshift-install is in your $PATH
  ansible.builtin.command:
    cmd: "openshift-install-fips agent create image --dir {{ work_dir }} --log-level debug"
  register: iso_generation
  changed_when: true
  when: boot_method == 'iso'

- name: Generate the Agent PXE boot files
  ansible.builtin.command:
    cmd: "openshift-install-fips agent create pxe-files --dir {{ work_dir }} --log-level debug"
  register: pxe_generation
  changed_when: true
  when: boot_method == 'pxe'

- name: Display ISO location
  ansible.builtin.debug:
    msg: "ISO generated successfully at: {{ work_dir }}/agent.x86_64.iso"
  when: boot_method == 'iso'

- name: Display PXE boot files location
  ansible.builtin.debug:
    msg: "PXE boot files generated successfully in: {{ work_dir }}/boot-artifacts/"
  when: boot_method == 'pxe'

- name: Retrieve Kubeadmin credentials
  ansible.builtin.slurp:
    src: "{{ work_dir }}/auth/kubeadmin-password"
  register: kubeadmin_pass_encoded

- name: Show Kubeadmin Password
  ansible.builtin.debug:
    msg:
      - "KUBEADMIN PASSWORD - STORE SAFELY"
      - "-----------------------------------"
      - "Kubeadmin Password: {{ kubeadmin_pass_encoded['content'] | b64decode }}"
      - "Kubeconfig Path: {{ work_dir }}/auth/kubeconfig"
      - "-----------------------------------"
...
